apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fusion-dev

resources:
  - ../../base

namePrefix: dev-

patches:
  - target:
      kind: Deployment
      name: items-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
