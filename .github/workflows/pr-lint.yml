name: PR Quality, Lint & Helm Dry-Run

on:
  pull_request:
    branches: [ main ]

jobs:
  pr-validation:
    name: Code Style, Kubernetes Lint & Helm Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Linters & Test Runners
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pytest

      - name: Run Black Code Formatter Check
        run: |
          black --check services/

      - name: Run Isort Import Sorting Check
        run: |
          isort --check-only --profile black services/

      - name: Run Flake8 Code Quality
        run: |
          flake8 services/ --max-line-length=120 --statistics

      - name: Install Kubectl & Kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes Manifests
        run: |
          kubeconform -summary -strict -kubernetes-version 1.30.0 k8s/base/

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.3'

      - name: Helm Lint and Dry-Run Template
        run: |
          helm lint helm/fusion-platform/
          helm template test-release helm/fusion-platform/ --dry-run
