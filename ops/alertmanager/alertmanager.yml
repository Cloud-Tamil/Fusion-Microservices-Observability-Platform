global:
  resolve_timeout: 5m

# Cluster configuration (disabled peer lookup for local standalone docker-compose)
cluster:
  listen_address: ""
  peers: []

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 3h
  receiver: 'default-webhook'
  routes:
    # Critical SLO or Service Outages trigger critical receiver
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true
    # Warning alerts route to notifications webhook / slack
    - match:
        severity: warning
      receiver: 'slack-warning-channel'

inhibit_rules:
  # Inhibit warning alerts if service is completely down
  - source_match:
      alertname: 'FusionServiceDown'
    target_match:
      severity: 'warning'
    equal: ['service', 'instance']

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://notifications-service:8004/notifications/dispatch'
        send_resolved: true

  - name: 'pagerduty-critical'
    webhook_configs:
      - url: 'http://notifications-service:8004/notifications/dispatch'
        send_resolved: true

  - name: 'slack-warning-channel'
    webhook_configs:
      - url: 'http://notifications-service:8004/notifications/dispatch'
        send_resolved: true

