apiVersion: 1

datasources:
  - name: Prometheus-Primary
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Prometheus-Replica
    type: prometheus
    access: proxy
    url: http://prometheus-replica:9091
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
