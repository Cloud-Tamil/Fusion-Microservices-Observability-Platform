global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'fusion-prod-k8s'
    region: 'us-central1'
    replica: 'prometheus-node1'

rule_files:
  - 'recording_rules.yml'
  - 'alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
      scheme: http
      timeout: 10s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8000']
        labels:
          service: 'api-gateway'
          env: 'prod'

  - job_name: 'items-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['items-service:8002']
        labels:
          service: 'items-service'
          env: 'prod'

  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:8001']
        labels:
          service: 'auth-service'
          env: 'prod'

  - job_name: 'orders-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['orders-service:8003']
        labels:
          service: 'orders-service'
          env: 'prod'

  - job_name: 'notifications-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notifications-service:8004']
        labels:
          service: 'notifications-service'
          env: 'prod'
